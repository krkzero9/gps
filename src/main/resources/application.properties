spring.application.name=payment-request-service

spring.datasource.url=jdbc:h2:mem:payments;MODE=PostgreSQL;DB_CLOSE_DELAY=-1

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

payment-request.max-amount=1000000.00

# A lost create race (two requests with the same Idempotency-Key at the same moment) is expected
# and handled in PaymentRequestService. Without this, Hibernate logs it at ERROR, including the key.
# Real database errors are still logged: ApiExceptionHandler logs every unexpected exception.
logging.level.org.hibernate.engine.jdbc.spi.SqlExceptionHelper=OFF


# Tokens come from Microsoft Entra ID (client-credentials flow). Only public values here, no secrets.
# issuer-uri: Spring downloads Entra's signing keys and checks the token's issuer and expiry.
# audiences: the token must be issued for THIS API (v2 tokens carry the API's client id as "aud").
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://login.microsoftonline.com/e3f0ddb8-42ef-470c-9148-3d4e776d03c3/v2.0
spring.security.oauth2.resourceserver.jwt.audiences=6bdd59a8-e2b0-463e-a39b-2e1227f83be5