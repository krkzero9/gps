spring.application.name=payment-request-service

spring.datasource.url=jdbc:h2:mem:payments;MODE=PostgreSQL;DB_CLOSE_DELAY=-1

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

payment-request.max-amount=1000000.00

# A lost create race (two requests with the same Idempotency-Key at the same moment) is expected
# and handled in PaymentRequestService. Without this, Hibernate logs it at ERROR, including the key.
# Real database errors are still logged: ApiExceptionHandler logs every unexpected exception.
logging.level.org.hibernate.engine.jdbc.spi.SqlExceptionHelper=OFF